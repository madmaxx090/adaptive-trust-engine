services:
  api:
    build: .
    ports:
      - "8008:8000"
    environment:
      # Docker service names — never localhost inside the container.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ate}:${POSTGRES_PASSWORD:-ate_dev_password}@postgres:5432/${POSTGRES_DB:-ate}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ate_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ate} -d $${POSTGRES_DB:-ate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
